<title>Managers That Suck — search any manager. See the data. Watch them improve.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF7F1;
  --card:#FFFFFF;
  --ink:#23262E;
  --soft:#6B7280;
  --line:#E9E3D8;
  --red:#E2474B;
  --red-wash:#FCEAE9;
  --green:#149E7A;
  --green-wash:#E0F3EC;
  --amber:#F0B429;
  --amber-wash:#FBF0D7;
  --display:'Bricolage Grotesque','Arial Black',sans-serif;
  --body:'Albert Sans',-apple-system,sans-serif;
  --mono:'IBM Plex Mono',Menlo,monospace;
  --sh-sm:0 1px 2px rgba(35,38,46,.06),0 2px 8px rgba(35,38,46,.05);
  --sh-md:0 2px 4px rgba(35,38,46,.05),0 12px 32px rgba(35,38,46,.10);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--amber);color:var(--ink)}
a{color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}
.hide{display:none!important}

/* ============ top bar ============ */
.topbar{position:fixed;top:0;left:0;right:0;z-index:90;background:rgba(250,247,241,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand svg{display:block}
.brand-word{font-family:var(--display);font-weight:800;font-size:1rem;line-height:.92;letter-spacing:-.01em}
.brand-word em{font-style:normal;color:var(--red)}
.topsearch{flex:1;max-width:430px;position:relative;margin-left:8px}
.topsearch input{width:100%;height:42px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:0 14px 0 38px;font-family:var(--body);font-size:.94rem;color:var(--ink);box-shadow:var(--sh-sm);transition:border-color .15s,box-shadow .15s}
.topsearch input:focus{outline:none;border-color:var(--ink);box-shadow:var(--sh-md)}
.topsearch .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--soft);pointer-events:none}
.topsearch kbd{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.66rem;color:var(--soft);border:1px solid var(--line);border-radius:5px;padding:2px 6px;background:var(--paper)}
.topnav{display:flex;gap:6px;margin-left:auto;align-items:center}
.tlink{font-weight:600;font-size:.88rem;color:var(--soft);text-decoration:none;padding:8px 12px;border-radius:10px;transition:all .15s}
.tlink:hover{color:var(--ink);background:rgba(35,38,46,.05)}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;text-decoration:none;border-radius:12px;padding:10px 18px;background:var(--ink);color:#fff;box-shadow:var(--sh-sm);transition:transform .12s,box-shadow .12s,background .12s;border:1.5px solid var(--ink)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh-md)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.lg{padding:14px 24px;font-size:1rem;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
@media(max-width:880px){.topsearch{display:none}.tlink{display:none}}

/* ============ shared ============ */
main{min-height:100svh}
#app > .wrap:not(.homesec){padding-top:96px;padding-bottom:80px}
@media(max-width:880px){#app > .wrap:not(.homesec){padding-top:84px}}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.view{padding-top:96px;padding-bottom:90px}
.vt{opacity:0;transform:translateY(14px)}
@media(prefers-reduced-motion:reduce){.vt{opacity:1;transform:none}}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;letter-spacing:-.015em;line-height:1.05}
.eyebrow{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm)}
.scorepill{display:inline-flex;align-items:center;font-family:var(--mono);font-weight:600;font-size:.78rem;border-radius:8px;padding:3px 9px;line-height:1.5}
.sp-green{background:var(--green-wash);color:#0D7A5D}
.sp-amber{background:var(--amber-wash);color:#9A7117}
.sp-red{background:var(--red-wash);color:#C2363A}
.trend{font-family:var(--mono);font-weight:600;font-size:.78rem}
.t-up{color:var(--green)}.t-down{color:var(--red)}
.avatar{border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;color:#fff;flex-shrink:0;text-transform:uppercase}
.stamp{display:inline-block;font-family:var(--mono);font-weight:600;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;border:2px solid currentColor;border-radius:8px;padding:4px 10px;transform:rotate(-2deg)}
.st-green{color:var(--green)}.st-red{color:var(--red)}.st-amber{color:#9A7117;background:var(--amber-wash)}
.crumb{font-family:var(--mono);font-size:.74rem;color:var(--soft);margin-bottom:18px;display:flex;gap:8px;align-items:center}
.crumb a{text-decoration:none;color:var(--soft)}
.crumb a:hover{color:var(--ink)}

/* ============ home hero ============ */
.hero{position:relative;padding:150px 0 60px;overflow:hidden}
#stream{position:absolute;inset:0;z-index:0;pointer-events:none}
.hero-in{position:relative;z-index:1;max-width:840px;margin:0 auto;padding:0 20px;text-align:center}
.hero h1{font-size:clamp(2.5rem,6.4vw,4.4rem);max-width:18ch;margin:14px auto 0}
.hero h1 .u-red{color:var(--red)}
.hero h1 .u-green{color:var(--green);position:relative;white-space:nowrap}
.hero h1 .u-green::after{content:"";position:absolute;left:0;right:0;bottom:.04em;height:.12em;background:var(--amber);z-index:-1;border-radius:3px;transform:rotate(-.6deg)}
.hero p.sub{color:var(--soft);font-size:clamp(1rem,1.7vw,1.18rem);max-width:54ch;margin:18px auto 34px}
.hero p.sub b{color:var(--ink)}

.bigsearch{position:relative;max-width:660px;margin:0 auto;text-align:left}
.bigsearch input{width:100%;height:68px;border:2px solid var(--ink);border-radius:20px;background:var(--card);padding:0 130px 0 58px;font-family:var(--body);font-size:1.12rem;color:var(--ink);box-shadow:0 4px 0 rgba(35,38,46,.9),var(--sh-md);transition:box-shadow .15s,transform .15s}
.bigsearch input:focus{outline:none;transform:translateY(-2px);box-shadow:0 6px 0 var(--red),0 20px 48px rgba(35,38,46,.16)}
.bigsearch input::placeholder{color:#A8ABB3}
.bigsearch .mag{position:absolute;left:22px;top:34px;transform:translateY(-50%);color:var(--soft);pointer-events:none}
.bigsearch .go{position:absolute;right:10px;top:10px;height:48px;border-radius:13px;padding:0 20px;background:var(--red);color:#fff;font-weight:700;font-size:.95rem;border:none;transition:background .15s}
.bigsearch .go:hover{background:#C93539}
.try{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.try span{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.try button{font-family:var(--mono);font-size:.78rem;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;color:var(--soft);transition:all .15s}
.try button:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-1px)}

/* dropdown (shared by both searches) */
.dd{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--card);border:1.5px solid var(--line);border-radius:16px;box-shadow:var(--sh-md);overflow:hidden;z-index:80;max-height:430px;overflow-y:auto}
.dd-h{font-family:var(--mono);font-size:.64rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);padding:12px 18px 6px}
.dd-row{display:flex;align-items:center;gap:13px;padding:11px 18px;cursor:pointer;border:none;width:100%;text-align:left;background:none;transition:background .1s}
.dd-row:hover,.dd-row.sel{background:var(--paper)}
.dd-row .nm{font-weight:600;font-size:.96rem;line-height:1.3}
.dd-row .sb{font-size:.8rem;color:var(--soft);line-height:1.3}
.dd-row .end{margin-left:auto;display:flex;align-items:center;gap:10px}
.dd-empty{padding:22px 20px;text-align:center}
.dd-empty .nm{font-weight:600;margin-bottom:4px}
.dd-empty .sb{font-size:.85rem;color:var(--soft);margin-bottom:14px}
mark{background:var(--amber-wash);color:inherit;border-radius:3px;padding:0 1px}

.hero-stats{display:flex;justify-content:center;gap:34px;margin-top:54px;flex-wrap:wrap}
.hstat{text-align:center}
.hstat .n{font-family:var(--display);font-weight:800;font-size:1.9rem}
.hstat .n.red{color:var(--red)}.hstat .n.green{color:var(--green)}
.hstat .l{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);max-width:21ch;margin:2px auto 0;line-height:1.6}

/* ============ home sections ============ */
.homesec{padding:46px 0 8px}
.homesec-h{display:flex;align-items:baseline;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.homesec-h h2{font-size:1.5rem}
.homesec-h .more{margin-left:auto;font-family:var(--mono);font-size:.76rem;color:var(--soft);text-decoration:none}
.homesec-h .more:hover{color:var(--ink)}
.cardrow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:920px){.cardrow{grid-template-columns:1fr}}
.mcard{padding:20px;display:block;text-decoration:none;transition:transform .15s,box-shadow .15s;cursor:pointer}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.mcard-top{display:flex;gap:13px;align-items:center;margin-bottom:14px}
.mcard .nm{font-weight:700;font-size:1.02rem;line-height:1.25}
.mcard .sb{font-size:.8rem;color:var(--soft)}
.mcard svg.spark{display:block;width:100%}
.mcard-bot{display:flex;align-items:center;gap:10px;margin-top:12px}
.howrow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:6px}
@media(max-width:920px){.howrow{grid-template-columns:1fr}}
.how{padding:24px}
.how .num{font-family:var(--mono);font-weight:600;font-size:.7rem;letter-spacing:.12em;color:var(--red);margin-bottom:10px}
.how h3{font-size:1.08rem;margin-bottom:8px}
.how p{font-size:.9rem;color:var(--soft)}
.how p b{color:var(--ink)}

/* ============ results page ============ */
.res-h h1{font-size:1.9rem;margin:6px 0 4px}
.res-h .sb{color:var(--soft)}
.tabs{display:flex;gap:8px;margin:22px 0}
.tab{font-weight:600;font-size:.86rem;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--soft);transition:all .15s}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.reslist{display:flex;flex-direction:column;gap:12px;max-width:780px}
.resrow{display:flex;align-items:center;gap:16px;padding:16px 20px;text-decoration:none;transition:transform .12s,box-shadow .12s;cursor:pointer}
.resrow:hover{transform:translateX(4px);box-shadow:var(--sh-md)}
.resrow .nm{font-weight:700;font-size:1.04rem}
.resrow .sb{font-size:.84rem;color:var(--soft)}
.resrow .end{margin-left:auto;display:flex;align-items:center;gap:12px;flex-shrink:0}
.noresult{max-width:560px;padding:34px;text-align:center}
.noresult h2{font-size:1.4rem;margin-bottom:8px}
.noresult p{color:var(--soft);margin-bottom:20px}

/* ============ profile ============ */
.pro-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:26px;margin-bottom:18px}
.pro-head .nm h1{font-size:1.85rem}
.pro-head .sb{color:var(--soft);font-size:.94rem;margin-top:3px}
.pro-head .sb a{font-weight:600;color:var(--ink)}
.pro-head .badges{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ringwrap{margin-left:auto;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{position:relative;width:112px;height:112px}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rv b{font-family:var(--display);font-size:1.55rem;font-weight:800}
.ring .rv span{font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;color:var(--soft);text-transform:uppercase}
.ring-meta{font-family:var(--mono);font-size:.7rem;color:var(--soft);line-height:2;text-transform:uppercase;letter-spacing:.06em}
.ring-meta b{color:var(--ink)}
@media(max-width:760px){.ringwrap{margin-left:0}}
.grid2{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
@media(max-width:920px){.grid2{grid-template-columns:1fr}}
.panel{padding:24px}
.panel h3{font-size:1.05rem;margin-bottom:2px}
.panel .ph{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:16px}
.legend{display:flex;gap:16px;font-family:var(--mono);font-size:.7rem;color:var(--soft);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.callout{margin-top:14px;border-top:1px dashed var(--line);padding-top:13px;font-size:.9rem}
.callout b.bad{color:var(--red)}
.callout b.good{color:var(--green)}
svg text{font-family:var(--mono)}
.barrow{display:grid;grid-template-columns:200px 1fr 32px;gap:12px;align-items:center;margin-bottom:10px}
.barrow .bl{font-size:.85rem;line-height:1.3}
.bartrack{height:16px;background:var(--paper);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.barfill{height:100%;width:0;background:var(--red);border-radius:5px}
.barrow .bv{font-family:var(--mono);font-size:.78rem;color:var(--soft);text-align:right}
@media(max-width:620px){.barrow{grid-template-columns:1fr;gap:4px}.barrow .bv{text-align:left}}
.reply{border-left:3px solid var(--green);padding-left:15px;font-size:.93rem;margin:4px 0 16px}
.planline{font-size:.9rem;border-top:1px dashed var(--line);padding-top:13px;margin-top:14px}
.planline b{color:var(--green)}
.reviews{display:flex;flex-direction:column;gap:12px}
.review{padding:16px 18px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper)}
.review .rh{display:flex;gap:10px;align-items:center;margin-bottom:8px;font-family:var(--mono);font-size:.68rem;color:var(--soft);letter-spacing:.06em;text-transform:uppercase;flex-wrap:wrap}
.review .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.review .tag{font-family:var(--mono);font-size:.68rem;background:var(--red-wash);color:#C2363A;border-radius:6px;padding:2px 8px}
.review .tag.help{background:var(--green-wash);color:#0D7A5D}
.review p{font-size:.9rem}
.pro-cta{display:flex;gap:12px;margin:22px 0 0;flex-wrap:wrap}

/* ============ company ============ */
.co-mgrlist{display:flex;flex-direction:column;gap:12px;margin-top:18px}

/* ============ assessment ============ */
.assess-wrap{max-width:780px;margin:0 auto}
.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
@media(max-width:700px){.modegrid{grid-template-columns:1fr}}
.mode{padding:26px;text-align:left;transition:transform .15s,box-shadow .15s,border-color .15s;cursor:pointer}
.mode:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--ink)}
a.mode{display:block;text-decoration:none;color:inherit}
.mode h3{font-size:1.15rem;margin:10px 0 6px}
.mode p{font-size:.88rem;color:var(--soft)}
.mode .mt{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-top:14px;display:block}
.progress{position:sticky;top:64px;z-index:40;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 18px;display:flex;align-items:center;gap:16px;box-shadow:var(--sh-sm);margin-bottom:20px}
.pbar{flex:1;height:9px;background:var(--paper);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--amber),var(--green));border-radius:5px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.plabel{font-family:var(--mono);font-size:.7rem;color:var(--soft);letter-spacing:.06em;white-space:nowrap}
.qcat h2{font-size:1.45rem}
.qcat .catsub{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:4px 0 18px}
.subhead{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:22px 0 8px}
.qrow{padding:16px 18px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px}
.qrow .qt{font-size:.94rem;font-weight:500;margin-bottom:12px}
.qrow .controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.seg{display:flex;gap:5px}
.seg button{width:42px;height:38px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-family:var(--mono);font-weight:600;font-size:.86rem;color:var(--soft);transition:all .12s}
.seg button:hover{border-color:var(--ink);color:var(--ink)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff;transform:scale(1.06)}
.seg-l{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);display:flex;justify-content:space-between;margin-top:5px}
.impwrap{display:flex;align-items:center;gap:8px;margin-left:auto}
.impwrap .il{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.imp{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:3px 6px;background:var(--paper)}
.imp button{width:26px;height:26px;border-radius:7px;font-weight:700;color:var(--soft)}
.imp button:hover{background:var(--card);color:var(--ink)}
.imp b{font-family:var(--mono);font-size:.86rem;width:14px;text-align:center}
@media(max-width:640px){.impwrap{margin-left:0}}
.stepnav{display:flex;gap:12px;margin-top:24px;align-items:center}
.steperr{font-size:.84rem;color:var(--red);font-weight:600;margin-left:6px}
.scale-key{font-family:var(--mono);font-size:.66rem;color:var(--soft);letter-spacing:.04em;background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:10px 16px;margin-bottom:18px;line-height:1.9}

.whostrip{display:flex;align-items:center;gap:13px;background:var(--ink);color:#fff;border-radius:14px;padding:11px 16px;margin-bottom:12px;flex-wrap:wrap;box-shadow:var(--sh-sm)}
.whostrip .wnm{font-weight:700;font-size:.94rem;line-height:1.2}
.whostrip .wsb{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;color:#9FB0C6;text-transform:uppercase}
.livechips{margin-left:auto;display:flex;gap:20px;align-items:center}
.lc{text-align:right}
.lc .lcv{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1;transition:color .2s}

.f{margin-bottom:16px}

/* ============ perspective toggle ============ */
.persp{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.persp button{flex:1;min-width:230px;text-align:left;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:15px 18px;transition:all .15s}
.persp button:hover{border-color:var(--ink)}
.persp button.on{border-color:var(--ink);background:var(--ink);color:#fff;box-shadow:var(--sh-md)}
.persp .pt{font-weight:700;font-size:.95rem;display:block}
.persp .ps{font-size:.78rem;opacity:.75;display:block;margin-top:2px}

/* ============ improvement report ============ */
.report-head{padding:28px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.report-head h1{font-size:1.7rem}
.report-head .sb{color:var(--soft);font-size:.9rem;margin-top:4px}
.rx{padding:22px;border-left:5px solid var(--red);margin-bottom:14px}
.rx.rank2{border-left-color:var(--amber)}

.rx-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.rx-h h4{font-size:1.05rem}
.rx-h .cat{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.rx .why{font-size:.9rem;color:var(--soft);margin-bottom:12px}
.rx ol{margin:0 0 12px 20px;font-size:.92rem}
.rx ol li{margin-bottom:6px}
.rx ol li::marker{font-family:var(--mono);font-weight:600;color:var(--red)}
.rx .metric{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--green);border-top:1px dashed var(--line);padding-top:10px}
.blind{background:var(--red-wash);border:1.5px dashed var(--red);border-radius:14px;padding:16px 20px;font-size:.92rem;margin-top:14px}

.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}

.tl{padding:18px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper)}

.tl ul{margin:8px 0 0 18px;font-size:.85rem}

.report-cta{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;align-items:center}
#planStamp{display:none;font-family:var(--mono);font-weight:600;font-size:.82rem;letter-spacing:.08em;color:var(--green);border:3px double var(--green);border-radius:10px;padding:9px 15px;transform:rotate(-3deg)}

<script>
/* ================================================================
   DATA — the original MTS-360 instrument (110 questions, 19 subscales,
   9 categories) recovered intact from the 2010 assessment engine.
   ================================================================ */
const CATS = ['Administrative','Leadership','Communication','Adaptability','Motivation','Technical','Cognitive','Results'];
const BANK = [
 {cat:'Administrative', sub:'Planning', qs:[
  ['Involves others in the planning process','The team helps build the plan before it is announced, not after.'],
  ['Actually uses plans to manage','The plan shows up in standups and decisions, not just the kickoff deck.'],
  ['Develops complete, well-detailed plans','Owners, dates, dependencies, and risks are written down before work starts.'],
  ['Makes plans that are clear and realistic','Anyone on the team can restate the plan, and the dates survive contact with reality.']]},
 {cat:'Administrative', sub:'Organizing', qs:[
  ['Organizes and schedules the work of subordinates','Everyone knows what they are doing this week without asking twice.'],
  ['Maintains a balance between the overall “big picture” and day-to-day needs','Daily fires get fought without the quarter\u2019s goal disappearing.'],
  ['Deals with higher priority problems and tasks first','The most important problem gets the morning, not the leftovers.'],
  ['Establishes effective and efficient procedures for getting work done','Routine work has a routine path; nobody reinvents the request process.']]},
 {cat:'Administrative', sub:'Personal Organization & Time Management', qs:[
  ['Makes good use of time','The calendar matches stated priorities, and meetings end with decisions.'],
  ['Sets daily goals; prepares daily “to do” lists','Each day starts with a written top-three, visible and honored.'],
  ['Maintains a well-organized and orderly work space','Finding a document takes seconds, not an archaeology dig.'],
  ['Keeps information and documentation in an orderly manner','Decisions, notes, and files live where the team can find them.'],
  ['Processes paperwork quickly and effectively','Approvals and admin clear in days and never become the bottleneck.'],
  ['Promptly returns phone calls or responds to written requests','Messages get answers within a day, even if just “received — answer by Friday.”'],
  ['Takes time to meet with subordinates','1:1s happen on schedule and are never the first thing cut.']]},

 'Planning':{why:'Plans nobody helped make get ignored in execution — involvement is what converts a plan from your document into the team\'s commitment.',

 'Personal Organization & Time Management':{why:'A manager who can\'t find time for subordinates is, functionally, absent. Time discipline is what makes you reachable.',

 'Leadership Style & Influence':{why:'Standards are set by example or not at all. Teams excel toward what they watch you do, not what you announce.',

  m:'“Sets an example which encourages excellence” at next 360'},
 'Motivating Others':{why:'Recognition is fuel and it expires fast. Praise paid late, vague, or never reads as praise withheld.',

 'Delegating & Controlling':{why:'Delegating tasks without authority creates errand-runners; delegating outcomes with authority creates managers-in-training.',

  m:'“Sufficient authority for assigned objectives” at next 360'},
 'Coaching & Developing':{why:'Growth is the wage you pay beyond salary. People who can\'t see a path forward through you will find one around you.',

  m:'“Gives feedback which improves performance” at next 360'},
 'Human Relations':{why:'Fairness is the operating system everything else runs on. One visibly unfair call costs ten fair ones.',

 'Oral Communications':{why:'A point that takes ten minutes to reach was lost at minute two. Clarity is a courtesy and a multiplier.',

 'Personal Adaptability':{why:'How you handle your own mistakes is the ceiling on how honestly your team reports theirs.',

const spark=(vals,w=240,h=44)=>{
  const lo=Math.min(...vals)-.03, hi=Math.max(...vals)+.03;
  const X=i=>4+(w-8)*i/(vals.length-1), Y=v=>h-4-(h-8)*(v-lo)/(hi-lo);
  const d=vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const up=vals[vals.length-1]>=vals[0], c=up?'#149E7A':'#E2474B';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" height="${h}"><path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/><circle cx="${X(vals.length-1)}" cy="${Y(vals[vals.length-1])}" r="3.4" fill="${c}"/></svg>`;};

/* ---- search engine ---- */
function searchAll(q){
  q=q.trim().toLowerCase();
  if(!q) return {m:[],c:[]};
  const score=(text)=>{const t=text.toLowerCase();
    if(t===q)return 100; if(t.startsWith(q))return 80;
    if(t.split(/\s+/).some(w=>w.startsWith(q)))return 60;
    if(t.includes(q))return 40; return 0;};
  const m=DB.managers.map(x=>({x,s:Math.max(score(x.name),score(x.coName)*.7,score(x.title)*.5)}))
    .filter(r=>r.s>0).sort((a,b)=>b.s-a.s||b.x.n-a.x.n).map(r=>r.x);
  const c=DB.companies.map(x=>({x,s:score(x.name)})).filter(r=>r.s>0).sort((a,b)=>b.s-a.s).map(r=>r.x);
  return {m,c};
}
const hl=(text,q)=>{const i=text.toLowerCase().indexOf(q.toLowerCase());
  return i<0?esc(text):esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));};

function bindSearch(input, dd){
  let sel=-1, rows=[];
  const close=()=>{dd.classList.add('hide');sel=-1;};
  const render=()=>{
    const q=input.value.trim();
    if(!q){close();return;}
    const {m,c}=searchAll(q);
    rows=[];
    let h='';
    if(m.length){h+='<div class="dd-h">Managers</div>';
      m.slice(0,5).forEach(x=>{rows.push({href:'#/m/'+x.id});
        h+=`<button class="dd-row" data-href="#/m/${x.id}">${avatar(x.name,38)}<div><div class="nm">${hl(x.name,q)}</div><div class="sb">${esc(x.title)} · ${hl(x.coName,q)}</div></div><div class="end">${pill(x.score)}${trendTxt(x.delta)}</div></button>`;});}
    if(c.length){h+='<div class="dd-h">Companies</div>';
      c.slice(0,3).forEach(x=>{const n=DB.managers.filter(mm=>mm.co===x.id).length;rows.push({href:'#/c/'+x.id});
        h+=`<button class="dd-row" data-href="#/c/${x.id}">${avatar(x.name,38)}<div><div class="nm">${hl(x.name,q)}</div><div class="sb">${esc(x.industry)} · ${esc(x.city)}</div></div><div class="end"><span class="scorepill sp-amber">${n} managers</span></div></button>`;});}
    if(!m.length&&!c.length){
      h=`<div class="dd-empty"><div class="nm">No file on “${esc(q)}” yet</div><div class="sb">Be the first. Register them anonymously — the profile is public, you are not.</div><a class="btn green" href="#/add?name=${encodeURIComponent(q)}">+ Add “${esc(q)}”</a></div>`;}
    dd.innerHTML=h; dd.classList.remove('hide');
    $$('.dd-row',dd).forEach(r=>r.addEventListener('click',()=>{location.hash=r.dataset.href;close();input.blur();}));
    if(!reduced) gsap.from(dd.children,{opacity:0,y:6,duration:.22,stagger:.025,ease:'power2.out'});
  };
  input.addEventListener('input',render);
  input.addEventListener('focus',render);
  input.addEventListener('keydown',e=>{
    const items=$$('.dd-row',dd);
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,items.length-1);}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);}
    else if(e.key==='Enter'){e.preventDefault();
      if(sel>=0&&items[sel]) location.hash=items[sel].dataset.href;
      else location.hash='#/search?q='+encodeURIComponent(input.value.trim());
      close();input.blur();return;}
    else if(e.key==='Escape'){close();input.blur();return;}
    else return;
    items.forEach((it,i)=>it.classList.toggle('sel',i===sel));
    if(items[sel]) items[sel].scrollIntoView({block:'nearest'});
  });
  document.addEventListener('click',e=>{if(!dd.contains(e.target)&&e.target!==input)close();});
}

function drawRadar(svgEl, team, self){
  const cx=180,cy=186,R=126,n=CATS.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v];};
  let g='';
  [0.25,0.5,0.7,0.8,1].forEach(r=>{const ring=CATS.map((_,i)=>pt(i,r).join(',')).join(' ');
    const hot=r===0.7||r===0.8;
    g+=`<polygon points="${ring}" fill="none" stroke="${hot?'#C9BFA9':'#EFE9DD'}" stroke-width="${hot?1.3:1}" ${hot?'stroke-dasharray="4 4"':''}/>`;});
  CATS.forEach((l,i)=>{const[x,y]=pt(i,1),[lx,ly]=pt(i,1.16);
    g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#F0EAE0"/>`;
    g+=`<text x="${lx}" y="${ly}" font-size="10.5" fill="#6B7280" text-anchor="middle" dominant-baseline="middle">${l.toUpperCase()}</text>`;});
  const poly=v=>v.map((x,i)=>pt(i,x).join(',')).join(' ');
  g+=`<polygon class="rTeam" points="${poly(team)}" fill="rgba(20,158,122,.16)" stroke="#149E7A" stroke-width="2.5" stroke-linejoin="round"/>`;
  if(self) g+=`<polygon class="rSelf" points="${poly(self)}" fill="rgba(226,71,75,.09)" stroke="#E2474B" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round"/>`;
  svgEl.setAttribute('viewBox','0 0 360 372'); svgEl.innerHTML=g;
  $$('.rTeam,.rSelf',svgEl).forEach((p,k)=>gsap.from(p,{scale:0,opacity:0,transformOrigin:`${cx}px ${cy}px`,duration:1,delay:.15+k*.2,ease:'back.out(1.4)',scrollTrigger:{trigger:svgEl,start:'top 85%'}}));
}
function drawArc(svgEl, vals){
  const qs=["Q3'24","Q4'24","Q1'25","Q2'25","Q3'25","Q4'25","Q1'26","Q2'26"];
  const L=52,Rt=14,T=16,B=234,W=520,lo=Math.min(.42,Math.min(...vals)-.05),hi=Math.max(.92,Math.max(...vals)+.05);
  const X=i=>L+(W-L-Rt)*i/(qs.length-1), Y=v=>B-(B-T)*(v-lo)/(hi-lo);
  let g='';
  g+=`<rect x="${L}" y="${Y(.7)}" width="${W-L-Rt}" height="${B-Y(.7)}" fill="rgba(226,71,75,.06)"/>`;
  g+=`<rect x="${L}" y="${Y(.8)}" width="${W-L-Rt}" height="${Y(.7)-Y(.8)}" fill="rgba(240,180,41,.12)"/>`;
  g+=`<rect x="${L}" y="${T}" width="${W-L-Rt}" height="${Y(.8)-T}" fill="rgba(20,158,122,.09)"/>`;
  [[.7,'#E2474B'],[.8,'#149E7A']].forEach(([v,c])=>{
    g+=`<line x1="${L}" x2="${W-Rt}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-dasharray="5 5" stroke-width="1.2"/>`;
    g+=`<text x="${L-7}" y="${Y(v)+4}" font-size="10.5" fill="${c}" text-anchor="end">${v.toFixed(2)}</text>`;});
  qs.forEach((q,i)=>g+=`<text x="${X(i)}" y="${B+20}" font-size="9.5" fill="#6B7280" text-anchor="middle">${q}</text>`);
  const d=vals.map((v,i)=>`${i?'L':'M'}${X(i)},${Y(v)}`).join(' ');
  g+=`<path class="arcP" d="${d}" fill="none" stroke="#23262E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>g+=`<circle class="arcD" cx="${X(i)}" cy="${Y(v)}" r="5" fill="${bandColor(v)}" stroke="#fff" stroke-width="2"/>`);
  svgEl.setAttribute('viewBox','0 0 520 262'); svgEl.innerHTML=g;
  const p=$('.arcP',svgEl), len=p.getTotalLength();
  gsap.set(p,{strokeDasharray:len,strokeDashoffset:len});
  gsap.to(p,{strokeDashoffset:0,duration:1.8,ease:'power2.inOut',scrollTrigger:{trigger:svgEl,start:'top 85%'}});
  gsap.from($$('.arcD',svgEl),{scale:0,transformOrigin:'center',duration:.35,stagger:.14,ease:'back.out(3)',delay:.25,scrollTrigger:{trigger:svgEl,start:'top 85%'}});
}

async function api(path,body){
  const r=await fetch('/api'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);

/* ---- assessment engine ---- */
const A={mode:null,persp:'team',target:null,steps:[],step:0,ans:{}};
function buildSteps(mode){
  const byCat={};
  BANK.forEach(s=>{(byCat[s.cat]=byCat[s.cat]||[]).push(mode==='quick'?{...s,qs:[s.qs[0]]}:s);});
  return CATS.map(c=>({cat:c,subs:byCat[c]}));
}
function qid(si,bi,qi){return `${si}_${bi}_${qi}`;}
function vAssessPick(id,params){
  mount('t-assess-pick');

  A.persp=(params&&params.get('self')==='1')?'self':'team';

  const sync=()=>{
    $('#perspTeam').classList.toggle('on',A.persp==='team');
    $('#perspSelf').classList.toggle('on',A.persp==='self');
    $('#apWhoLabel').textContent=A.persp==='self'?'Which manager are you?':'Who is this assessment about?';
    if(A.persp==='self'&&A.target)$('#apFor').textContent=' — '+A.target.name+' (self)';
    else if(A.target)$('#apFor').textContent=' — '+A.target.name;
    else $('#apFor').textContent='';
  };
  $('#perspTeam').addEventListener('click',()=>{A.persp='team';sync();});
  $('#perspSelf').addEventListener('click',()=>{A.persp='self';sync();});
  $('#mgrList').innerHTML=DB.managers.map(x=>`<option value="${esc(x.name)}">${esc(x.title)} · ${esc(x.coName)}</option>`).join('');
  const who=$('#apWho'), whoStatus=$('#apWhoStatus');
  const setTarget=t=>{A.target=t;
    if(t){whoStatus.innerHTML=`✓ ATTACHED: <b>${esc(t.name)}</b> · ${esc(t.coName)} — ${A.persp==='self'?'your report & plan publish to this profile':'your rating files to this profile'}`;whoStatus.style.color='var(--green)';}
    else{whoStatus.textContent='Not attached yet — you can still take it, but results won\'t file to a profile.';whoStatus.style.color='var(--soft)';}
    sync();};
  if(A.target)who.value=A.target.name;
  who.addEventListener('input',()=>{const v=who.value.trim().toLowerCase();
    setTarget(DB.managers.find(x=>x.name.toLowerCase()===v)||null);});
  setTarget(A.target);
  $$('.mode').forEach(b=>b.addEventListener('click',()=>{
    A.mode=b.dataset.mode;A.steps=buildSteps(A.mode);A.step=0;A.ans={};
    renderStep();
  }));
}
function threadQ(t){
  if(!A.target||A.persp==='self')return t;
  const f=A.target.name.split(' ')[0];
  if(t.startsWith('Overall, '))return 'Overall, '+f+' '+t.slice(9);
  return f+' '+t.charAt(0).toLowerCase()+t.slice(1);
}
function liveScores(si){
  let on=0,od=0,cn=0,cd=0;
  Object.entries(A.ans).forEach(([k,a])=>{if(!a.e)return;
    on+=a.e*a.i;od+=5*a.i;
    if(+k.split('_')[0]===si){cn+=a.e*a.i;cd+=5*a.i;}});
  return {overall:od?on/od:null,cat:cd?cn/cd:null};
}
function updateLive(si){
  const {overall,cat}=liveScores(si);
  const ov=$('#liveOverall'),cv=$('#liveCat');
  const set=(el,v)=>{if(!el)return;el.textContent=v==null?'—':v.toFixed(2);el.style.color=v==null?'#9FB0C6':(v>=.8?'#4ED4AC':v>=.7?'#F0B429':'#FF7A7E');
    if(v!=null&&!reduced)gsap.fromTo(el,{scale:1.18},{scale:1,duration:.3,ease:'back.out(2)'});};
  set(ov,overall);set(cv,cat);
}
function itemChip(row,id){
  const chip=$('.qscore',row), a=A.ans[id];
  if(!a||!a.e){chip.textContent='— · unanswered';chip.className='qscore';return;}
  const v=a.e/5,[bt,bc]=band(v);
  chip.textContent=`E${a.e}×I${a.i} → ${v.toFixed(2)} · ${bt.toUpperCase()}`;
  chip.className='qscore '+bc;
  if(!reduced)gsap.fromTo(chip,{scale:.85},{scale:1,duration:.3,ease:'back.out(2.5)'});
}
function renderStep(){
  mount('t-assess-run');
  const s=A.steps[A.step], si=A.step;
  const total=A.steps.reduce((t,st)=>t+st.subs.reduce((tt,b)=>tt+b.qs.length,0),0);
  const done=Object.keys(A.ans).length;
  /* identity strip: the manager is threaded through every step */
  const strip=$('#whoStrip');
  const live=`<div class="livechips"><div class="lc"><div class="lcv" id="liveOverall">—</div><div class="lcl">RUNNING OVERALL</div></div><div class="lc"><div class="lcv" id="liveCat">—</div><div class="lcl">THIS CATEGORY</div></div></div>`;
  if(A.target){
    strip.innerHTML=`${avatar(A.target.name,40)}<div><div class="wnm">${esc(A.target.name)}</div><div class="wsb">${A.persp==='self'?'SELF-ASSESSMENT — RATE YOURSELF HONESTLY':'YOU ARE ASSESSING'} · ${esc(A.target.title)}, ${esc(A.target.coName)}</div></div>${live}`;
  } else {
    strip.innerHTML=`<div><div class="wnm">Unattached practice run</div><div class="wsb">RESULTS WON'T FILE TO A PROFILE — GO BACK TO ATTACH A MANAGER</div></div>${live}`;
  }
  $('#pStep').textContent=`${si+1} / ${A.steps.length} · ${s.cat.toUpperCase()}`;
  $('#pPct').textContent=Math.round(done/total*100)+'%';
  $('#pFill').style.width=(done/total*100)+'%';
  if(A.persp==='self')$('#scaleKey').innerHTML='<b>SELF-ASSESSMENT</b> — rate what you actually do, not what you intend; the report is only as honest as you are. · <b>EXTENT</b> 1 not at all → 5 very great extent — <b>5 is always the good end</b> · <b>IMPORTANCE</b> defaults to 3 · scoring is live above';
  let h=`<div class="qcat vt"><h2>${s.cat}</h2><div class="catsub">${s.subs.reduce((t,b)=>t+b.qs.length,0)} ITEMS · CATEGORY ${si+1} OF ${A.steps.length}${A.target?' · SUBJECT: '+esc(A.target.name.toUpperCase()):''}</div></div>`;
  s.subs.forEach((b,bi)=>{
    if(A.mode==='full')h+=`<div class="subhead vt">${b.sub}</div>`;
    b.qs.forEach((q,qi)=>{
      const id=qid(si,bi,qi), a=A.ans[id]||{};
      h+=`<div class="qrow vt" data-id="${id}"><div class="qt">${esc(threadQ(q[0]))}</div>
        <div class="qx"><b>WHAT A 5 LOOKS LIKE</b>${esc(q[1])}</div>
        <div class="controls">
        <div><div class="seg">${[1,2,3,4,5].map(v=>`<button data-v="${v}" class="${a.e===v?'on':''}" aria-label="extent ${v}">${v}</button>`).join('')}</div><div class="seg-l"><span>NOT AT ALL</span><span>VERY GREAT EXTENT</span></div></div>
        <div class="impwrap"><span class="il">IMPORTANCE</span><div class="imp"><button data-d="-1" aria-label="less important">−</button><b>${a.i||3}</b><button data-d="1" aria-label="more important">+</button></div></div>
        <span class="qscore">— · unanswered</span>
      </div></div>`;});
  });
  $('#stepHost').innerHTML=h;
  showVt($('#stepHost'));
  $$('.qrow').forEach(row=>{
    const id=row.dataset.id;
    if(A.ans[id]&&A.ans[id].e)itemChip(row,id);
    $$('.seg button',row).forEach(b=>b.addEventListener('click',()=>{
      A.ans[id]={...(A.ans[id]||{i:3}),e:+b.dataset.v,i:(A.ans[id]&&A.ans[id].i)||3};
      $$('.seg button',row).forEach(x=>x.classList.toggle('on',x===b));
      gsap.fromTo(b,{scale:.85},{scale:1.06,duration:.25,ease:'back.out(3)'});
      itemChip(row,id); updateLive(si);
      const t2=A.steps.reduce((t,st)=>t+st.subs.reduce((tt,bb)=>tt+bb.qs.length,0),0);
      $('#pFill').style.width=(Object.keys(A.ans).length/t2*100)+'%';
      $('#pPct').textContent=Math.round(Object.keys(A.ans).length/t2*100)+'%';
      $('#stepErr').classList.add('hide');
    }));
    $$('.imp button',row).forEach(b=>b.addEventListener('click',()=>{
      const cur=A.ans[id]||{i:3};cur.i=Math.min(5,Math.max(1,(cur.i||3)+(+b.dataset.d)));A.ans[id]=cur;
      $('b',$('.imp',row)).textContent=cur.i;
      itemChip(row,id); updateLive(si);
    }));
  });
  updateLive(si);
  $('#backBtn').addEventListener('click',()=>{if(A.step>0){A.step--;renderStep();}else vAssessPick(A.target&&A.target.id,new URLSearchParams(A.persp==='self'?'self=1':''));});
  $('#nextBtn').textContent=A.step===A.steps.length-1?'See the score →':'Next category →';
  $('#nextBtn').addEventListener('click',()=>{
    const need=s.subs.reduce((t,b)=>t+b.qs.length,0);
    const have=s.subs.reduce((t,b,bi)=>t+b.qs.filter((_,qi)=>A.ans[qid(si,bi,qi)]&&A.ans[qid(si,bi,qi)].e).length,0);
    if(have<need){$('#stepErr').classList.remove('hide');
      const miss=$$('.qrow').find(r=>!(A.ans[r.dataset.id]&&A.ans[r.dataset.id].e));
      if(miss){miss.scrollIntoView({behavior:'smooth',block:'center'});gsap.fromTo(miss,{x:-7},{x:0,duration:.5,ease:'elastic.out(1,.3)'});}
      return;}
    if(A.step<A.steps.length-1){A.step++;renderStep();}
    else renderDone();
  });
}
function renderDone(){
  const perCat={}, perSub=[];
  A.steps.forEach((s,si)=>{let num=0,den=0;
    s.subs.forEach((b,bi)=>{let sn=0,sd=0;
      b.qs.forEach((_,qi)=>{const a=A.ans[qid(si,bi,qi)];if(a&&a.e){num+=a.e*a.i;den+=5*a.i;sn+=a.e*a.i;sd+=5*a.i;}});
      if(sd)perSub.push({sub:b.sub,cat:s.cat,v:sn/sd});});
    perCat[s.cat]=den?num/den:0;});
  const vals=CATS.map(c=>perCat[c]);
  const overall=(()=>{let n=0,d=0;A.steps.forEach((s,si)=>s.subs.forEach((b,bi)=>b.qs.forEach((_,qi)=>{const a=A.ans[qid(si,bi,qi)];if(a&&a.e){n+=a.e*a.i;d+=5*a.i;}})));return n/d;})();
  if(A.persp==='self')return renderReport(overall,vals,perSub);
  mount('t-assess-done');

  const o={v:0},el=$('#finalScore');
  gsap.to(o,{v:overall,duration:1.6,ease:'power2.out',onUpdate:()=>{el.textContent=o.v.toFixed(3);el.style.color=bandColor(o.v);}});
  $('#catLines').innerHTML=CATS.map((c,i)=>`<div class="catline"><div class="cl">${c}</div><div class="bartrack"><div class="barfill" data-w="${(vals[i]*100).toFixed(1)}" style="background:${bandColor(vals[i])}"></div></div><div class="cv">${vals[i].toFixed(2)}</div></div>`).join('');
  $$('#catLines .barfill').forEach((b,i)=>gsap.to(b,{width:b.dataset.w+'%',duration:1,delay:.2+i*.08,ease:'power3.out'}));
  $$('#helpChips .chip').forEach(c=>c.addEventListener('click',()=>{c.classList.toggle('on');gsap.fromTo(c,{scale:.92},{scale:1,duration:.3,ease:'back.out(3)'});}));
  $('#fileBtn').addEventListener('click',()=>{
    if(!$$('#helpChips .chip.on').length){gsap.fromTo('#helpChips',{x:-7},{x:0,duration:.5,ease:'elastic.out(1,.3)'});return;}
    const id='ANON-'+Array.from(crypto.getRandomValues(new Uint8Array(4))).map(b=>'0123456789ABCDEFGHJKMNPQRSTVWXYZ'[b%32]).join('');

    const st=$('#filedStamp');st.style.display='inline-block';
    gsap.fromTo(st,{scale:2.2,opacity:0,rotate:-13},{scale:1,opacity:1,rotate:-3,duration:.55,ease:'back.out(2.2)'});
    if(A.target&&demoMode){const m=A.target;
      m.n++; m.trend=(m.trend.length?m.trend.slice(1):[]).concat([+( (m.score? m.score*.7:0) + overall*( m.score?.3:1)).toFixed(2)]);
      while(m.trend.length<2)m.trend.unshift(+(overall*.92).toFixed(2));
      const old=m.score||overall; m.score=+((m.score? old*.7+overall*.3 : overall)).toFixed(3); m.delta=+(m.score-old+(m.delta||0)*.5).toFixed(2);
      m.cats.team=m.cats.team?m.cats.team.map((v,i)=>+(v*.7+vals[i]*.3).toFixed(3)):vals.map(v=>+v.toFixed(3));
      m.reviews.unshift({when:'JUN 2026',tags:[],helps:$$('#helpChips .chip.on').map(c=>c.textContent),quote:'Filed via MTS-360 '+(A.mode==='full'?'(full, 110 items)':'(quick read)')+'.'});

        helps:$$('#helpChips .chip.on').map(c=>c.textContent)})

    if(m&&!demoMode){
      $('#publishPlan').disabled=true;
      api('/managers/'+m.id+'/assessments',{perspective:'self',mode:A.mode,answers:A.ans,
        focus:worst.map(s=>s.sub)})
      .then(d=>{absorbManager(d.manager);
        $('#planDate').textContent=reassess;
        const st=$('#planStamp');st.style.display='inline-block';
        gsap.fromTo(st,{scale:2.2,opacity:0,rotate:-13},{scale:1,opacity:1,rotate:-3,duration:.55,ease:'back.out(2.2)'});
        setTimeout(()=>location.hash='#/m/'+m.id,1700);})
      .catch(e=>{$('#publishPlan').disabled=false;$('#publishPlan').textContent='⚠ '+e.message+' — retry';});
    } else if(m){
      m.cats.self=vals.map(v=>+v.toFixed(3));
      if(!m.cats.team)m.cats.team=null;
      m.plan=true;
      m.reply=m.reply||('Self-assessed '+today+'. Plan published: '+worst.map(s=>s.sub).join(', ')+'. Re-assess me in 90 days.');
      $('#planDate').textContent=reassess;
      const st=$('#planStamp');st.style.display='inline-block';
      gsap.fromTo(st,{scale:2.2,opacity:0,rotate:-13},{scale:1,opacity:1,rotate:-3,duration:.55,ease:'back.out(2.2)'});
      $('#publishPlan').disabled=true;
      setTimeout(()=>location.hash='#/m/'+m.id,1700);
    } else {
      $('#planDate').textContent=reassess;
      const st=$('#planStamp');st.style.display='inline-block';
      gsap.fromTo(st,{scale:2.2,opacity:0,rotate:-13},{scale:1,opacity:1,rotate:-3,duration:.55,ease:'back.out(2.2)'});
    }
  });
}

/* ---- inline mount animation for hand-built views ---- */
function mountInline(){scrollTo(0,0);ScrollTrigger.getAll().forEach(s=>s.kill());
  if(!reduced)gsap.to($$('.vt',app),{opacity:1,y:0,duration:.6,stagger:.06,ease:'power3.out'});
  else $$('.vt',app).forEach(e=>{e.style.opacity=1;e.style.transform='none';});}

/* ---- three.js ambient stream (home hero only) ---- */
let streamRAF=null;
function startStream(){
  const canvas=$('#stream'); if(!canvas||!window.THREE)return;
  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(50,1,1,300); camera.position.set(0,0,70);
  const cvs=document.createElement('canvas');cvs.width=cvs.height=64;
  const g2=cvs.getContext('2d'),grd=g2.createRadialGradient(32,32,0,32,32,32);
  grd.addColorStop(0,'rgba(255,255,255,1)');grd.addColorStop(.4,'rgba(255,255,255,.6)');grd.addColorStop(1,'rgba(255,255,255,0)');
  g2.fillStyle=grd;g2.fillRect(0,0,64,64);
  const tex=new THREE.CanvasTexture(cvs);
  const N=750, geo=new THREE.BufferGeometry();
  const pos=new Float32Array(N*3), col=new Float32Array(N*3);
  const u0=new Float32Array(N), spd=new Float32Array(N), off=new Float32Array(N), zz=new Float32Array(N);
  for(let i=0;i<N;i++){u0[i]=Math.random();spd[i]=.022+Math.random()*.03;off[i]=Math.random()*Math.PI*2;zz[i]=(Math.random()-.5)*22;}
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({size:2.4,map:tex,vertexColors:true,transparent:true,opacity:.5,depthWrite:false});
  const pts=new THREE.Points(geo,mat); scene.add(pts);
  const RED=new THREE.Color(0xE2474B),AMB=new THREE.Color(0xF0B429),GRN=new THREE.Color(0x149E7A),tmp=new THREE.Color();
  let mx=0,my=0; const pm=e=>{mx=(e.clientX/innerWidth-.5)*2;my=(e.clientY/innerHeight-.5)*2;};
  addEventListener('pointermove',pm);
  function size(){const w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||600;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
  size();addEventListener('resize',size);
  const clock=new THREE.Clock();
  function frame(){
    if(!document.body.contains(canvas)){cancelAnimationFrame(streamRAF);removeEventListener('pointermove',pm);return;}
    const t=clock.getElapsedTime();
    for(let i=0;i<N;i++){const u=(u0[i]+t*spd[i])%1,j=i*3;
      pos[j]=-62+124*u;
      pos[j+1]=6-50*u+56*u*u + Math.sin(off[i]+t*.7+u*9)*2.2 - 8;
      pos[j+2]=zz[i];
      if(u<.5)tmp.copy(RED).lerp(AMB,u/.5);else tmp.copy(AMB).lerp(GRN,(u-.5)/.5);
      col[j]=tmp.r;col[j+1]=tmp.g;col[j+2]=tmp.b;}
    geo.attributes.position.needsUpdate=true;geo.attributes.color.needsUpdate=true;
    pts.rotation.y=mx*.06; pts.position.y=-my*2;
    renderer.render(scene,camera);
    if(!reduced)streamRAF=requestAnimationFrame(frame);
  }
  if(reduced){const t=1;for(let i=0;i<N;i++){const u=u0[i],j=i*3;pos[j]=-62+124*u;pos[j+1]=6-50*u+56*u*u-8;pos[j+2]=zz[i];
    if(u<.5)tmp.copy(RED).lerp(AMB,u/.5);else tmp.copy(AMB).lerp(GRN,(u-.5)/.5);col[j]=tmp.r;col[j+1]=tmp.g;col[j+2]=tmp.b;}
    geo.attributes.position.needsUpdate=true;geo.attributes.color.needsUpdate=true;renderer.render(scene,camera);}
  else frame();
}

/* ---- router ---- */
function route(){
  const h=location.hash||'#/';
  const [path,qs]=h.slice(2).split('?');
  const params=new URLSearchParams(qs||'');
  const seg=path.split('/').filter(Boolean);
  if(!seg.length)return vHome();
  if(seg[0]==='search')return vResults(params.get('q')||'');
  if(seg[0]==='m')return vManager(seg[1]);
  if(seg[0]==='c')return vCompany(seg[1]);
  if(seg[0]==='add')return vAdd(params);
  if(seg[0]==='assess')return vAssessPick(seg[1],params);
  vHome();
}
addEventListener('hashchange',route);
(async function boot(){
  try{
    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),3500);
    const r=await fetch('/api/bootstrap',{signal:ctl.signal}); clearTimeout(t);
    const j=await r.json();
    if(!j.success)throw 0;
    DB.companies=j.data.companies; DB.managers=j.data.managers;
  }catch(_){
    DB.companies=SEED.companies; DB.managers=SEED.managers; demoMode=true;
    console.info('MTS: no backend reachable — running in demo mode (in-memory).');
  }
  route();
})();
